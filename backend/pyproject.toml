[project]
name = "pinni-backend"
version = "0.1.0"
description = "Pinni API (Track C): FastAPI backend serving the shared contract"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "jsonschema[format-nongpl]>=4.26.0",
    "neo4j>=6.4.1",
    "pinni-agent",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
# Track B: the recommender ranks the feed.
pinni-agent = { path = "../agent", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
